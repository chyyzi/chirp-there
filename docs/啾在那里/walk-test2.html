const ChirpCollision = (() => {
const {Box3,Line3,Plane,Sphere,Triangle,Vector3,Layers}=AFRAME.THREE;


class Capsule {

	constructor( start = new Vector3( 0, 0, 0 ), end = new Vector3( 0, 1, 0 ), radius = 1 ) {

		this.start = start;
		this.end = end;
		this.radius = radius;

	}

	clone() {

		return new Capsule( this.start.clone(), this.end.clone(), this.radius );

	}

	set( start, end, radius ) {

		this.start.copy( start );
		this.end.copy( end );
		this.radius = radius;

	}

	copy( capsule ) {

		this.start.copy( capsule.start );
		this.end.copy( capsule.end );
		this.radius = capsule.radius;

	}

	getCenter( target ) {

		return target.copy( this.end ).add( this.start ).multiplyScalar( 0.5 );

	}

	translate( v ) {

		this.start.add( v );
		this.end.add( v );

	}

	checkAABBAxis( p1x, p1y, p2x, p2y, minx, maxx, miny, maxy, radius ) {

		return (
			( minx - p1x < radius || minx - p2x < radius ) &&
			( p1x - maxx < radius || p2x - maxx < radius ) &&
			( miny - p1y < radius || miny - p2y < radius ) &&
			( p1y - maxy < radius || p2y - maxy < radius )
		);

	}

	intersectsBox( box ) {

		return (
			this.checkAABBAxis(
				this.start.x, this.start.y, this.end.x, this.end.y,
				box.min.x, box.max.x, box.min.y, box.max.y,
				this.radius ) &&
			this.checkAABBAxis(
				this.start.x, this.start.z, this.end.x, this.end.z,
				box.min.x, box.max.x, box.min.z, box.max.z,
				this.radius ) &&
			this.checkAABBAxis(
				this.start.y, this.start.z, this.end.y, this.end.z,
				box.min.y, box.max.y, box.min.z, box.max.z,
				this.radius )
		);

	}

}






const _v1 = new Vector3();
const _v2 = new Vector3();
const _point1 = new Vector3();
const _point2 = new Vector3();
const _plane = new Plane();
const _line1 = new Line3();
const _line2 = new Line3();
const _sphere = new Sphere();
const _capsule = new Capsule();

const _temp1 = new Vector3();
const _temp2 = new Vector3();
const _temp3 = new Vector3();
const EPS = 1e-10;

function lineToLineClosestPoints( line1, line2, target1 = null, target2 = null ) {

	const r = _temp1.copy( line1.end ).sub( line1.start );
	const s = _temp2.copy( line2.end ).sub( line2.start );
	const w = _temp3.copy( line2.start ).sub( line1.start );

	const a = r.dot( s ),
		b = r.dot( r ),
		c = s.dot( s ),
		d = s.dot( w ),
		e = r.dot( w );

	let t1, t2;
	const divisor = b * c - a * a;

	if ( Math.abs( divisor ) < EPS ) {

		const d1 = - d / c;
		const d2 = ( a - d ) / c;

		if ( Math.abs( d1 - 0.5 ) < Math.abs( d2 - 0.5 ) ) {

			t1 = 0;
			t2 = d1;

		} else {

			t1 = 1;
			t2 = d2;

		}

	} else {

		t1 = ( d * a + e * c ) / divisor;
		t2 = ( t1 * a - d ) / c;

	}

	t2 = Math.max( 0, Math.min( 1, t2 ) );
	t1 = Math.max( 0, Math.min( 1, t1 ) );

	if ( target1 ) {

		target1.copy( r ).multiplyScalar( t1 ).add( line1.start );

	}

	if ( target2 ) {

		target2.copy( s ).multiplyScalar( t2 ).add( line2.start );

	}

}

class Octree {

	constructor( box ) {

		this.box = box;
		this.bounds = new Box3();

		this.subTrees = [];
		this.triangles = [];
		this.layers = new Layers();

	}

	addTriangle( triangle ) {

		this.bounds.min.x = Math.min( this.bounds.min.x, triangle.a.x, triangle.b.x, triangle.c.x );
		this.bounds.min.y = Math.min( this.bounds.min.y, triangle.a.y, triangle.b.y, triangle.c.y );
		this.bounds.min.z = Math.min( this.bounds.min.z, triangle.a.z, triangle.b.z, triangle.c.z );
		this.bounds.max.x = Math.max( this.bounds.max.x, triangle.a.x, triangle.b.x, triangle.c.x );
		this.bounds.max.y = Math.max( this.bounds.max.y, triangle.a.y, triangle.b.y, triangle.c.y );
		this.bounds.max.z = Math.max( this.bounds.max.z, triangle.a.z, triangle.b.z, triangle.c.z );

		this.triangles.push( triangle );

		return this;

	}

	calcBox() {

		this.box = this.bounds.clone();

		// offset small amount to account for regular grid
		this.box.min.x -= 0.01;
		this.box.min.y -= 0.01;
		this.box.min.z -= 0.01;

		return this;

	}

	split( level ) {

		if ( ! this.box ) return;

		const subTrees = [];
		const halfsize = _v2.copy( this.box.max ).sub( this.box.min ).multiplyScalar( 0.5 );

		for ( let x = 0; x < 2; x ++ ) {

			for ( let y = 0; y < 2; y ++ ) {

				for ( let z = 0; z < 2; z ++ ) {

					const box = new Box3();
					const v = _v1.set( x, y, z );

					box.min.copy( this.box.min ).add( v.multiply( halfsize ) );
					box.max.copy( box.min ).add( halfsize );

					subTrees.push( new Octree( box ) );

				}

			}

		}

		let triangle;

		while ( triangle = this.triangles.pop() ) {

			for ( let i = 0; i < subTrees.length; i ++ ) {

				if ( subTrees[ i ].box.intersectsTriangle( triangle ) ) {

					subTrees[ i ].triangles.push( triangle );

				}

			}

		}

		for ( let i = 0; i < subTrees.length; i ++ ) {

			const len = subTrees[ i ].triangles.length;

			if ( len > 24 && level < 9 ) {

				subTrees[ i ].split( level + 1 );

			}

			if ( len !== 0 ) {

				this.subTrees.push( subTrees[ i ] );

			}

		}

		return this;

	}

	build() {

		this.calcBox();
		this.split( 0 );

		return this;

	}

	getRayTriangles( ray, triangles ) {

		for ( let i = 0; i < this.subTrees.length; i ++ ) {

			const subTree = this.subTrees[ i ];
			if ( ! ray.intersectsBox( subTree.box ) ) continue;

			if ( subTree.triangles.length > 0 ) {

				for ( let j = 0; j < subTree.triangles.length; j ++ ) {

					if ( triangles.indexOf( subTree.triangles[ j ] ) === - 1 ) triangles.push( subTree.triangles[ j ] );

				}

			} else {

				subTree.getRayTriangles( ray, triangles );

			}

		}

		return triangles;

	}

	triangleCapsuleIntersect( capsule, triangle ) {

		triangle.getPlane( _plane );

		const d1 = _plane.distanceToPoint( capsule.start ) - capsule.radius;
		const d2 = _plane.distanceToPoint( capsule.end ) - capsule.radius;

		if ( ( d1 > 0 && d2 > 0 ) || ( d1 < - capsule.radius && d2 < - capsule.radius ) ) {

			return false;

		}

		const delta = Math.abs( d1 / ( Math.abs( d1 ) + Math.abs( d2 ) ) );
		const intersectPoint = _v1.copy( capsule.start ).lerp( capsule.end, delta );

		if ( triangle.containsPoint( intersectPoint ) ) {

			return { normal: _plane.normal.clone(), point: intersectPoint.clone(), depth: Math.abs( Math.min( d1, d2 ) ) };

		}

		const r2 = capsule.radius * capsule.radius;

		const line1 = _line1.set( capsule.start, capsule.end );

		const lines = [
			[ triangle.a, triangle.b ],
			[ triangle.b, triangle.c ],
			[ triangle.c, triangle.a ]
		];

		for ( let i = 0; i < lines.length; i ++ ) {

			const line2 = _line2.set( lines[ i ][ 0 ], lines[ i ][ 1 ] );

			lineToLineClosestPoints( line1, line2, _point1, _point2 );

			if ( _point1.distanceToSquared( _point2 ) < r2 ) {

				return {
					normal: _point1.clone().sub( _point2 ).normalize(),
					point: _point2.clone(),
					depth: capsule.radius - _point1.distanceTo( _point2 )
				};

			}

		}

		return false;

	}

	triangleSphereIntersect( sphere, triangle ) {

		triangle.getPlane( _plane );

		if ( ! sphere.intersectsPlane( _plane ) ) return false;

		const depth = Math.abs( _plane.distanceToSphere( sphere ) );
		const r2 = sphere.radius * sphere.radius - depth * depth;

		const plainPoint = _plane.projectPoint( sphere.center, _v1 );

		if ( triangle.containsPoint( sphere.center ) ) {

			return { normal: _plane.normal.clone(), point: plainPoint.clone(), depth: Math.abs( _plane.distanceToSphere( sphere ) ) };

		}

		const lines = [
			[ triangle.a, triangle.b ],
			[ triangle.b, triangle.c ],
			[ triangle.c, triangle.a ]
		];

		for ( let i = 0; i < lines.length; i ++ ) {

			_line1.set( lines[ i ][ 0 ], lines[ i ][ 1 ] );
			_line1.closestPointToPoint( plainPoint, true, _v2 );

			const d = _v2.distanceToSquared( sphere.center );

			if ( d < r2 ) {

				return { normal: sphere.center.clone().sub( _v2 ).normalize(), point: _v2.clone(), depth: sphere.radius - Math.sqrt( d ) };

			}

		}

		return false;

	}

	getSphereTriangles( sphere, triangles ) {

		for ( let i = 0; i < this.subTrees.length; i ++ ) {

			const subTree = this.subTrees[ i ];

			if ( ! sphere.intersectsBox( subTree.box ) ) continue;

			if ( subTree.triangles.length > 0 ) {

				for ( let j = 0; j < subTree.triangles.length; j ++ ) {

					if ( triangles.indexOf( subTree.triangles[ j ] ) === - 1 ) triangles.push( subTree.triangles[ j ] );

				}

			} else {

				subTree.getSphereTriangles( sphere, triangles );

			}

		}

	}

	getCapsuleTriangles( capsule, triangles ) {

		for ( let i = 0; i < this.subTrees.length; i ++ ) {

			const subTree = this.subTrees[ i ];

			if ( ! capsule.intersectsBox( subTree.box ) ) continue;

			if ( subTree.triangles.length > 0 ) {

				for ( let j = 0; j < subTree.triangles.length; j ++ ) {

					if ( triangles.indexOf( subTree.triangles[ j ] ) === - 1 ) triangles.push( subTree.triangles[ j ] );

				}

			} else {

				subTree.getCapsuleTriangles( capsule, triangles );

			}

		}

	}

	sphereIntersect( sphere ) {

		_sphere.copy( sphere );

		const triangles = [];
		let result, hit = false;

		this.getSphereTriangles( sphere, triangles );

		for ( let i = 0; i < triangles.length; i ++ ) {

			if ( result = this.triangleSphereIntersect( _sphere, triangles[ i ] ) ) {

				hit = true;

				_sphere.center.add( result.normal.multiplyScalar( result.depth ) );

			}

		}

		if ( hit ) {

			const collisionVector = _sphere.center.clone().sub( sphere.center );
			const depth = collisionVector.length();

			return { normal: collisionVector.normalize(), depth: depth };

		}

		return false;

	}

	capsuleIntersect( capsule ) {

		_capsule.copy( capsule );

		const triangles = [];
		let result, hit = false;

		this.getCapsuleTriangles( _capsule, triangles );

		for ( let i = 0; i < triangles.length; i ++ ) {

			if ( result = this.triangleCapsuleIntersect( _capsule, triangles[ i ] ) ) {

				hit = true;

				_capsule.translate( result.normal.multiplyScalar( result.depth ) );

			}

		}

		if ( hit ) {

			const collisionVector = _capsule.getCenter( new Vector3() ).sub( capsule.getCenter( _v1 ) );
			const depth = collisionVector.length();

			return { normal: collisionVector.normalize(), depth: depth };

		}

		return false;

	}

	rayIntersect( ray ) {

		if ( ray.direction.length() === 0 ) return;

		const triangles = [];
		let triangle, position, distance = 1e100;

		this.getRayTriangles( ray, triangles );

		for ( let i = 0; i < triangles.length; i ++ ) {

			const result = ray.intersectTriangle( triangles[ i ].a, triangles[ i ].b, triangles[ i ].c, true, _v1 );

			if ( result ) {

				const newdistance = result.sub( ray.origin ).length();

				if ( distance > newdistance ) {

					position = result.clone().add( ray.origin );
					distance = newdistance;
					triangle = triangles[ i ];

				}

			}

		}

		return distance < 1e100 ? { distance: distance, triangle: triangle, position: position } : false;

	}

	fromGraphNode( group ) {

		group.updateWorldMatrix( true, true );

		group.traverse( ( obj ) => {

			if ( obj.isMesh === true ) {

				if ( this.layers.test( obj.layers ) ) {

					let geometry, isTemp = false;

					if ( obj.geometry.index !== null ) {

						isTemp = true;
						geometry = obj.geometry.toNonIndexed();

					} else {

						geometry = obj.geometry;

					}

					const positionAttribute = geometry.getAttribute( 'position' );

					for ( let i = 0; i < positionAttribute.count; i += 3 ) {

						const v1 = new Vector3().fromBufferAttribute( positionAttribute, i );
						const v2 = new Vector3().fromBufferAttribute( positionAttribute, i + 1 );
						const v3 = new Vector3().fromBufferAttribute( positionAttribute, i + 2 );

						v1.applyMatrix4( obj.matrixWorld );
						v2.applyMatrix4( obj.matrixWorld );
						v3.applyMatrix4( obj.matrixWorld );

						this.addTriangle( new Triangle( v1, v2, v3 ) );

					}

					if ( isTemp ) {

						geometry.dispose();

					}

				}

			}

		} );

		this.build();

		return this;

	}

	clear() {

		this.box = null;
		this.bounds.makeEmpty();

		this.subTrees.length = 0;
		this.triangles.length = 0;

		return this;

	}

}



return {Capsule,Octree};
})();
// 只按原始物体名称识别；three.js 导入时会把名称中的点去掉。
const ChirpNames = {
  floor: /^(Terrain_|Path_|PathEdge_|AncientTree_Clearing|Deck_\d)/,
  water: /^Water_/,
  tree: /^tree-/,
  rock: /^(rock-|ground-rocks-)/,
  rail: /^Boardwalk_(Rail|Post|Support)/,
  foliage: /PolyFoliage/i
};
function chirpOwner(mesh, root) {
  let n=mesh; while(n.parent && n.parent!==root) n=n.parent;
  return n;
}
function chirpAddTriangles(tree, mesh) {
  const T=AFRAME.THREE, pos=mesh.geometry.attributes.position, idx=mesh.geometry.index;
  const count=idx?idx.count:pos.count;
  for(let i=0;i<count;i+=3) {
    const a=new T.Vector3().fromBufferAttribute(pos,idx?idx.getX(i):i).applyMatrix4(mesh.matrixWorld);
    const b=new T.Vector3().fromBufferAttribute(pos,idx?idx.getX(i+1):i+1).applyMatrix4(mesh.matrixWorld);
    const c=new T.Vector3().fromBufferAttribute(pos,idx?idx.getX(i+2):i+2).applyMatrix4(mesh.matrixWorld);
    const tri=new T.Triangle(a,b,c);
    if(tri.getArea()>1e-10) tree.addTriangle(tri);
  }
}

// 动态只改网页显示，不修改 GLB 文件，也不改变树干碰撞。
AFRAME.registerComponent('gentle-nature', {
  schema: {enabled:{default:true}, strength:{default:1}},
  init: function() {
    this.time={value:0}; this.strength={value:1}; this.elapsed=0;
    this.originals=[]; this.materials=new Map(); this.geometries=new Map(); this.floaters=[];
    this.loaded=()=>this.setup();
    this.el.addEventListener('model-loaded',this.loaded);
    if(this.el.getObject3D('mesh')) this.setup();
  },
  setup: function() {
    this.restore();
    const root=this.el.getObject3D('mesh'); if(!root)return;
    root.traverse(mesh=>{
      if(!mesh.isMesh || Array.isArray(mesh.material))return;
      const owner=chirpOwner(mesh,root), name=owner.name;
      let kind=null;
      if(ChirpNames.tree.test(name) && ChirpNames.foliage.test(mesh.material.name)) kind='leaf';
      else if(/^(grass-|flower-)/.test(name))kind='grass';
      else if(/^bush-/.test(name))kind='bush';
      // 水生植物整体轻微浮动，根部和叶片保持在一起。
      if(!kind)return;
      const originalGeometry=mesh.geometry, originalMaterial=mesh.material;
      const gkey=originalGeometry.uuid+kind;
      let geometry=this.geometries.get(gkey);
      if(!geometry) {
        geometry=originalGeometry.clone();geometry.computeBoundingBox();
        const attr=geometry.attributes.position, box=geometry.boundingBox;
        const height=Math.max(.01,box.max.y-box.min.y), weights=new Float32Array(attr.count);
        for(let i=0;i<attr.count;i++) {
          const h=Math.max(0,Math.min(1,(attr.getY(i)-box.min.y)/height));
          weights[i]=kind==='leaf' ? .3+.7*h : h*h;
        }
        geometry.setAttribute('chirpWindWeight',new AFRAME.THREE.BufferAttribute(weights,1));
        this.geometries.set(gkey,geometry);
      }
      const mkey=originalMaterial.uuid+kind;
      let material=this.materials.get(mkey);
      if(!material) {
        material=originalMaterial.clone();
        const amplitude=kind==='leaf'?.07:kind==='bush'?.055:.045;
        material.onBeforeCompile=shader=>{
          shader.uniforms.chirpTime=this.time;shader.uniforms.chirpStrength=this.strength;
          shader.uniforms.chirpAmplitude={value:amplitude};
          shader.vertexShader='uniform float chirpTime;\nuniform float chirpStrength;\nuniform float chirpAmplitude;\nattribute float chirpWindWeight;\n'+shader.vertexShader;
          shader.vertexShader=shader.vertexShader.replace('#include <begin_vertex>',`#include <begin_vertex>
            vec3 chirpWorld=(modelMatrix*vec4(transformed,1.0)).xyz;
            vec3 chirpScale=vec3(length(modelMatrix[0].xyz),length(modelMatrix[1].xyz),length(modelMatrix[2].xyz));
            float chirpPhase=chirpWorld.x*.31+chirpWorld.z*.23;
            float chirpWind=(sin(chirpTime*1.35+chirpPhase)+.28*sin(chirpTime*2.1+chirpPhase*1.7));
            transformed.x+=chirpWind*chirpAmplitude*chirpStrength*chirpWindWeight/max(.001,chirpScale.x);
            transformed.z+=sin(chirpTime*1.1+chirpPhase+.9)*chirpAmplitude*.48*chirpStrength*chirpWindWeight/max(.001,chirpScale.z);
          `);
        };
        material.customProgramCacheKey=()=> 'chirp-gentle-wind-v1';
        this.materials.set(mkey,material);
      }
      this.originals.push({mesh,geometry:originalGeometry,material:originalMaterial});
      mesh.geometry=geometry;mesh.material=material;
    });
    root.children.forEach((obj,i)=>{
      if(!/^waterplant-/.test(obj.name))return;
      this.floaters.push({obj,position:obj.position.clone(),rotation:obj.rotation.clone(),phase:i*2.39996});
    });
    this.counts={windMeshes:this.originals.length,waterPlants:this.floaters.length};
  },
  tick: function(time,delta) {
    if(!delta)return;
    this.elapsed+=Math.min(delta,60)/1000;
    this.time.value=this.elapsed;
    this.strength.value=this.data.enabled?this.data.strength:0;
    const s=this.strength.value;
    for(const f of this.floaters) {
      f.obj.position.y=f.position.y+Math.sin(this.elapsed*.85+f.phase)*.015*s;
      f.obj.rotation.x=f.rotation.x+Math.sin(this.elapsed*.65+f.phase)*.003*s;
      f.obj.rotation.z=f.rotation.z+Math.sin(this.elapsed*.75+f.phase+1)*.004*s;
    }
  },
  restore: function() {
    for(const x of this.originals){x.mesh.geometry=x.geometry;x.mesh.material=x.material;}
    for(const f of this.floaters){f.obj.position.copy(f.position);f.obj.rotation.copy(f.rotation);}
    for(const m of this.materials.values())m.dispose();
    for(const g of this.geometries.values())g.dispose();
    this.originals=[];this.floaters=[];this.materials.clear();this.geometries.clear();
  },
  remove: function(){this.el.removeEventListener('model-loaded',this.loaded);this.restore();}
});

AFRAME.registerComponent('desktop-walk', {
  schema: {
    world:{type:'selector'}, camera:{type:'selector'},
    speed:{default:4}, runSpeed:{default:6.5}, jumpSpeed:{default:5}, gravity:{default:14},
    stepHeight:{default:.45}, maxDrop:{default:1.2}, maxSlope:{default:55},
    radius:{default:.26}, height:{default:1.7}
  },
  init: function() {
    const T=AFRAME.THREE;
    this.keys=new Set();this.ready=false;this.grounded=false;this.velocityY=0;
    this.bounds=new T.Box3();this.ray=new T.Ray();this.normal=new T.Vector3();
    this.capsule=new ChirpCollision.Capsule();
    this.start=this.el.object3D.position.clone();this.safe=this.start.clone();
    this.forward=new T.Vector3();this.right=new T.Vector3();this.move=new T.Vector3();this.quaternion=new T.Quaternion();
    this.status=document.getElementById('status');this.startButton=document.getElementById('start');this.lastHud=0;
    this.onKeyDown=e=>{
      if(!this.hasControl()||e.ctrlKey||e.metaKey||e.altKey)return;
      if(!['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight','Space','KeyR'].includes(e.code))return;
      e.preventDefault();this.keys.add(e.code);
      if(e.code==='Space'&&!e.repeat&&this.grounded){this.velocityY=this.data.jumpSpeed;this.takeoffY=this.el.object3D.position.y;this.grounded=false;}
      if(e.code==='KeyR'&&!e.repeat)this.reset();
    };
    this.onKeyUp=e=>this.keys.delete(e.code);this.clearKeys=()=>this.keys.clear();
    this.onModelLoaded=()=>this.queueBuild(true);
    this.onModelError=()=>{this.ready=false;this.startButton.disabled=true;this.status.textContent='模型加载失败。请确认 assets/model/Overall scene.glb 已放好，并通过 Live Server 打开。';};
    window.addEventListener('keydown',this.onKeyDown);window.addEventListener('keyup',this.onKeyUp);window.addEventListener('blur',this.clearKeys);
    document.addEventListener('pointerlockchange',this.clearKeys);
    this.data.world.addEventListener('model-loaded',this.onModelLoaded);this.data.world.addEventListener('model-error',this.onModelError);
    if(this.data.world.getObject3D('mesh'))this.onModelLoaded();
  },
  queueBuild: function(reset) {
    this.ready=false;this.startButton.disabled=true;this.keys.clear();
    this.status.textContent='模型已加载，正在建立地形和树石碰撞……';
    clearTimeout(this.buildTimer);
    this.buildTimer=setTimeout(()=>{
      try{this.scanSurfaces();if(reset||!this.safePosition(this.el.object3D.position))this.reset();}
      catch(e){console.error(e);this.ready=false;this.startButton.disabled=true;this.status.textContent='碰撞初始化失败，请把浏览器控制台错误发给我。';}
    },50);
  },
  scanSurfaces: function() {
    const root=this.data.world.getObject3D('mesh');if(!root)return;
    const T=AFRAME.THREE;
    this.floorTree=new ChirpCollision.Octree();this.waterTree=new ChirpCollision.Octree();this.obstacleTree=new ChirpCollision.Octree();
    this.floors=[];this.water=[];this.obstacles=[];this.bounds.makeEmpty();
    let trees=new Set(),rocks=new Set();
    this.data.world.object3D.updateWorldMatrix(true,true);
    root.traverse(mesh=>{
      if(!mesh.isMesh)return;
      const owner=chirpOwner(mesh,root),name=owner.name;
      const matNames=(Array.isArray(mesh.material)?mesh.material:[mesh.material]).map(m=>m.name||'');
      const tree=ChirpNames.tree.test(name)&&!matNames.some(n=>ChirpNames.foliage.test(n));
      const rock=ChirpNames.rock.test(name);
      const floor=ChirpNames.floor.test(name);
      if(floor||rock){chirpAddTriangles(this.floorTree,mesh);this.floors.push(mesh);}
      if(floor)this.bounds.expandByObject(mesh);
      if(ChirpNames.water.test(name)){chirpAddTriangles(this.waterTree,mesh);this.water.push(mesh);}
      if(tree||rock||ChirpNames.rail.test(name)) {
        chirpAddTriangles(this.obstacleTree,mesh);this.obstacles.push(mesh);
        if(tree)trees.add(owner);if(rock)rocks.add(owner);
      }
    });
    if(this.floors.length)this.floorTree.build();
    if(this.water.length)this.waterTree.build();
    if(this.obstacles.length)this.obstacleTree.build();
    this.ready=this.floors.length>0&&!this.bounds.isEmpty();this.startButton.disabled=!this.ready;
    this.counts={trees:trees.size,rocks:rocks.size,floorMeshes:this.floors.length,obstacleMeshes:this.obstacles.length};
    this.status.textContent=this.ready?'场景已就绪，点击「开始行走」。':'没有识别到地形，请保留 Terrain_ / Path_ / Deck_ 等物体名称。';
    document.getElementById('details').textContent=`碰撞已启用：${trees.size} 棵树 · ${rocks.size} 组石头 · 地形 / 木栈道`;
  },
  hasControl: function() {
    const scene=this.el.sceneEl;
    return this.ready&&scene.isPlaying&&document.pointerLockElement===scene.canvas&&!(AFRAME.INSPECTOR&&AFRAME.INSPECTOR.isOpened)&&!scene.is('vr-mode');
  },
  floorAt: function(x,z,upper) {
    const margin=this.data.radius+.08;
    if(x<this.bounds.min.x+margin||x>this.bounds.max.x-margin||z<this.bounds.min.z+margin||z>this.bounds.max.z-margin)return null;
    this.ray.origin.set(x,upper,z);this.ray.direction.set(0,-1,0);
    const hit=this.floorTree.rayIntersect(this.ray);
    if(!hit)return null;
    hit.triangle.getNormal(this.normal);
    if(this.normal.y<Math.cos(this.data.maxSlope*Math.PI/180))return null;
    if(this.water.length){
      this.ray.origin.y=this.bounds.max.y+50;
      const water=this.waterTree.rayIntersect(this.ray);
      if(water&&water.position.y>hit.position.y+.03)return null;
    }
    return hit.position.y;
  },
  collisionAt: function(x,y,z) {
    const r=this.data.radius;
    // 脚底到眼睛上方的胶囊体；树冠不进入碰撞树。
    this.capsule.start.set(x,y+r,z);this.capsule.end.set(x,y+this.data.height-r,z);this.capsule.radius=r;
    const hit=this.obstacleTree.capsuleIntersect(this.capsule);
    return hit&&hit.depth>.002?hit:null;
  },
  safePosition: function(p) {
    return this.floorAt(p.x,p.z,p.y+this.data.stepHeight)!==null&&!this.collisionAt(p.x,p.y,p.z);
  },
  reset: function() {
    if(!this.ready)return;
    let found=null;
    // 起点被后续放入的树石占用时，在入口附近寻找可站立位置。
    for(let ring=0;ring<=12&&!found;ring++)for(let i=0;i<(ring?24:1);i++){
      const a=i*Math.PI/12,x=this.start.x+Math.cos(a)*ring*.5,z=this.start.z+Math.sin(a)*ring*.5;
      const y=this.floorAt(x,z,this.bounds.max.y+50);
      if(y!==null&&!this.collisionAt(x,y+.035,z)){found={x,y:y+.035,z};break;}
    }
    if(!found){this.ready=false;this.startButton.disabled=true;this.status.textContent='入口被障碍遮挡，请调整 rig 的 position，再刷新页面。';return;}
    this.el.object3D.position.set(found.x,found.y,found.z);this.safe.copy(this.el.object3D.position);
    this.keys.clear();this.velocityY=0;this.grounded=true;this.takeoffY=found.y;
  },
  moveAxis: function(axis,amount) {
    if(!amount)return;
    const p=this.el.object3D.position,x=axis==='x'?p.x+amount:p.x,z=axis==='z'?p.z+amount:p.z;
    const floor=this.floorAt(x,z,p.y+(this.grounded?this.data.stepHeight:.005));
    if(floor===null)return;
    if((this.grounded?p.y:this.takeoffY)-floor>this.data.maxDrop)return;
    const y=this.grounded?floor+.035:p.y;
    if(this.collisionAt(x,y,z))return;
    // 支撑点探查避免身体一半伸出悬崖 / 水边。
    const offset=Math.sign(amount)*this.data.radius*.65;
    const edge=this.floorAt(x+(axis==='x'?offset:0),z+(axis==='z'?offset:0),y+this.data.stepHeight);
    if(edge===null||y-edge>this.data.maxDrop+(this.grounded?0:1))return;
    p.set(x,y,z);
  },
  tick: function(time,delta) {
    if(!this.hasControl()||!delta)return;
    const p=this.el.object3D.position;
    this.data.camera.object3D.getWorldQuaternion(this.quaternion);
    this.forward.set(0,0,-1).applyQuaternion(this.quaternion);this.forward.y=0;
    if(this.forward.lengthSq()<.0001){const look=this.data.camera.components['look-controls'],yaw=look?look.yawObject.rotation.y:0;this.forward.set(-Math.sin(yaw),0,-Math.cos(yaw));}
    this.forward.normalize();this.right.set(-this.forward.z,0,this.forward.x);
    const f=Number(this.keys.has('KeyW')||this.keys.has('ArrowUp'))-Number(this.keys.has('KeyS')||this.keys.has('ArrowDown'));
    const s=Number(this.keys.has('KeyD')||this.keys.has('ArrowRight'))-Number(this.keys.has('KeyA')||this.keys.has('ArrowLeft'));
    this.move.copy(this.forward).multiplyScalar(f).addScaledVector(this.right,s);if(this.move.lengthSq())this.move.normalize();
    const speed=this.keys.has('ShiftLeft')||this.keys.has('ShiftRight')?this.data.runSpeed:this.data.speed;
    const dt=Math.min(delta/1000,.06),steps=Math.max(1,Math.ceil(dt/.012)),step=dt/steps;
    for(let i=0;i<steps;i++) {
      this.moveAxis('x',this.move.x*speed*step);this.moveAxis('z',this.move.z*speed*step);
      const floor=this.floorAt(p.x,p.z,p.y+(this.grounded?this.data.stepHeight:.01));
      if(floor===null){p.copy(this.safe);this.velocityY=0;this.grounded=true;continue;}
      if(!this.grounded) {
        this.velocityY-=this.data.gravity*step;
        const next=p.y+this.velocityY*step;
        if(this.velocityY<=0&&next<=floor+.035){p.y=floor+.035;this.velocityY=0;this.grounded=true;}
        else {
          const hit=this.collisionAt(p.x,next,p.z);
          if(!hit)p.y=next;
          else if(this.velocityY>0)this.velocityY=0;
          else if(hit.normal.y>.35){p.y=next+hit.normal.y*hit.depth+.003;this.velocityY=0;this.grounded=true;}
          else {p.copy(this.safe);this.velocityY=0;this.grounded=true;}
        }
      }else p.y=floor+.035;
      if(this.grounded&&!this.collisionAt(p.x,p.y,p.z))this.safe.copy(p);
    }
    if(time-this.lastHud>180){document.getElementById('pose').textContent=`机位 ${p.x.toFixed(2)} / ${p.y.toFixed(2)} / ${p.z.toFixed(2)} · ${this.grounded?'地面':'跳跃中'}`;this.lastHud=time;}
  },
  pause: function(){if(this.keys)this.keys.clear();},
  play: function(){if(this.ready)this.queueBuild(false);},
  remove: function(){
    clearTimeout(this.buildTimer);window.removeEventListener('keydown',this.onKeyDown);window.removeEventListener('keyup',this.onKeyUp);window.removeEventListener('blur',this.clearKeys);
    document.removeEventListener('pointerlockchange',this.clearKeys);this.data.world.removeEventListener('model-loaded',this.onModelLoaded);this.data.world.removeEventListener('model-error',this.onModelError);
  }
});
  </script>
</head>
<body>
  <div id="hud">
    <div id="toolbar">
      <button id="help-toggle" aria-expanded="true" aria-controls="panel" title="行走时按 H 也能开关">收起说明 · H</button>
      <button id="start" disabled>开始行走</button>
    </div>
    <section id="panel" aria-label="行走测试操作说明">
      <strong>啾，在那里！ · 行走测试</strong>
      <div id="status" role="status" aria-live="polite">正在加载 Overall scene.glb……</div>
      <p><kbd>W A S D</kbd> 行走　鼠标 转头<br><kbd>空格</kbd> 跳跃　<kbd>Shift</kbd> 加速<br><kbd>H</kbd> 开关说明　<kbd>R</kbd> 回入口</p>
      <p class="muted">按 Esc 释放鼠标后，可点击按钮。<br>开始行走会自动收起说明；入口朝向林间主路。</p>
      <div class="actions"><button id="reset">回入口</button><button id="copy">复制机位</button><button id="rebuild">更新碰撞</button></div>
      <label id="wind-label"><input id="wind" type="checkbox" checked> 植物微风 / 荷叶浮动</label>
      <div id="details">正在准备地形和树石碰撞……</div>
      <span id="pose"></span>
      <p class="muted">Ctrl + Alt + I 打开编辑器。调整场景后关闭编辑器，碰撞会重算；也可点「更新碰撞」。此页是电脑键鼠测试版。</p>
    </section>
  </div>
  <div id="crosshair" hidden></div>
  <noscript>请启用浏览器 JavaScript，通过 VS Code 的 Live Server 打开本页。</noscript>

  <a-scene renderer="antialias: true" xr-mode-ui="enabled: false"
    inspector="url: https://cdn.jsdelivr.net/gh/c-frame/aframe-editor@1.7.x/dist/aframe-editor.min.js">
    <a-sky id="sky" src="../assets/images/sky1.png"></a-sky>
    <!-- 地面底板放在模型地形以下，避免与水面 / 坡地重叠闪烁。
         真正脚下的高度取自 GLB 内 Terrain / Path / Deck，而非这张平面。 -->
    <a-plane id="ground" position="0 -0.8 0" rotation="-90 0 0" width="160" height="140"
      material="src: url(../assets/images/ground.png); repeat: 24 24; roughness: 1; metalness: 0"></a-plane>

    <!-- %20 表示文件名中的空格。文件名仍然是 Overall scene.glb，不用改名。 -->
    <a-entity id="forest-world" gltf-model="url(../assets/model/Overall%20scene.glb)"
      gentle-nature="enabled: true; strength: 1"
      position="0 0 0" rotation="0 0 0" scale="1 1 1"></a-entity>
    <a-light type="ambient" color="#FFFFFF" intensity="0.8"></a-light>
    <a-light type="directional" color="#FFF3DE" intensity="0.8" position="-3 8 5"></a-light>

    <!-- 脚下起点在入口小路。修改 x / z 可换起点，y 会自动贴地。
         不要再加 movement-controls 或 wasd-controls，以免两套移动互相覆盖。 -->
    <a-entity id="rig" position="4 0 30"
      desktop-walk="world: #forest-world; camera: #camera; speed: 4; runSpeed: 6.5; jumpSpeed: 5; radius: 0.26">
      <a-entity id="camera" camera position="0 1.6 0" look-controls="pointerLockEnabled: true"></a-entity>
    </a-entity>
  </a-scene>
  <script>
    const scene=document.querySelector('a-scene');
    const panel=document.getElementById('panel'),helpButton=document.getElementById('help-toggle'),startButton=document.getElementById('start');
    const controller=()=>document.getElementById('rig').components['desktop-walk'];
    function showHelp(open){panel.hidden=!open;helpButton.textContent=open?'收起说明 · H':'操作说明 · H';helpButton.setAttribute('aria-expanded',String(open));}
    helpButton.addEventListener('click',()=>showHelp(panel.hidden));
    window.addEventListener('keydown',e=>{
      if(e.code!=='KeyH'||e.repeat||e.ctrlKey||e.altKey||e.metaKey)return;
      if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;
      if(AFRAME.INSPECTOR&&AFRAME.INSPECTOR.isOpened)return;
      e.preventDefault();showHelp(panel.hidden);
    });
    startButton.addEventListener('click',()=>{
      if(!controller()?.ready||!scene.canvas)return;
      if(!scene.canvas.requestPointerLock){showHelp(true);document.getElementById('status').textContent='请用电脑端 Chrome，通过 Live Server 打开此页面。';return;}
      const request=scene.canvas.requestPointerLock();
      if(request?.catch)request.catch(()=>{showHelp(true);document.getElementById('status').textContent='鼠标未锁定，请稍等一秒，再点击「开始行走」。';});
    });
    document.addEventListener('pointerlockchange',()=>{
      const locked=document.pointerLockElement===scene.canvas;
      document.getElementById('crosshair').hidden=!locked;startButton.hidden=locked;
      if(locked)showHelp(false);
      if(controller()?.ready)document.getElementById('status').textContent=locked?'行走中。按 H 开关说明，按 Esc 释放鼠标。':'已暂停。点击「开始行走」继续。';
    });
    document.getElementById('reset').addEventListener('click',()=>controller()?.reset());
    document.getElementById('rebuild').addEventListener('click',()=>controller()?.queueBuild(false));
    document.getElementById('wind').addEventListener('change',e=>document.getElementById('forest-world').setAttribute('gentle-nature','enabled',e.target.checked));
    document.getElementById('copy').addEventListener('click',async()=>{
      const p=document.getElementById('rig').object3D.position,r=document.getElementById('camera').object3D.rotation,d=AFRAME.THREE.MathUtils.radToDeg;
      const text=`rig position="${p.x.toFixed(3)} ${p.y.toFixed(3)} ${p.z.toFixed(3)}"\ncamera rotation="${d(r.x).toFixed(2)} ${d(r.y).toFixed(2)} ${d(r.z).toFixed(2)}"`;
      try{await navigator.clipboard.writeText(text);document.getElementById('status').textContent='机位已复制，可粘贴到记事本保存。';}catch{window.prompt('复制机位：',text);}
    });
    window.addEventListener('blur',()=>{if(document.pointerLockElement)document.exitPointerLock();});
  </script>
</body>
</html>
